[project]
name = "mth451-notebooks"
version = "0.1.0"
description = "Python notebooks for MTH 451/551"
requires-python = ">=3.12"
# Packages used inside the notebooks (also available in JupyterLite and Colab)
dependencies = [
    "numpy",
    "matplotlib",
    "ipywidgets",
]

[dependency-groups]
# Tools for building the course website: static HTML and JupyterLite
dev = [
    "ipykernel",
    "nbconvert",
    "jupyterlite-core",
    "jupyterlite-pyodide-kernel",
    "jupyter-server>=2.21.1",
]
# Converting the notebook sources (see makefile). Not in dev: JupyterLite would
# then include jupytext's JupyterLab extension.
convert = [
    "jupytext>=1.19.6",
]

[tool.uv]
package = false

# The notebooks' sources are src/*.py, in jupytext's percent format; to_ipynb.py
# converts them to ipynb/*.ipynb (see makefile). Only these notebook metadata
# keys are kept (mkindex.pl in site/ reads lecture, title, and hide), and only
# the tags of each cell (used by interactive.py).
[tool.jupytext]
formats = "py:percent"
notebook_metadata_filter = "kernelspec,lecture,title,hide,-jupytext"
cell_metadata_filter = "tags,-all"
